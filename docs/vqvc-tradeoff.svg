<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">VoiceQualityVC: less fry, but a different voice</title>
  <desc id="d">Scatter of creaky frames (x) against voice match (y). The original sits at 38% creak and 0.80 voice match. All seven reduce-fry presets land at 14 to 23% creak but only 0.57 to 0.62 voice match; the creak +3 sanity check lands at 43% and 0.50. None reaches the goal zone of little fry with the same voice.</desc>
  <style>
    .surface { fill: none; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .grid { stroke: #d1d9e0; stroke-width: 1; }
    .axis { stroke: #8c959f; stroke-width: 1; }
    .goal { fill: #1baf7a; fill-opacity: 0.10; stroke: #1baf7a; stroke-opacity: 0.55; stroke-dasharray: 4 3; }
    .goal-text { fill: #0f7a54; }
    .s1 { fill: #2a78d6; }
    .s2 { fill: #eb6834; }
    .orig { fill: #1f2328; }
    .ring { stroke: #ffffff; stroke-width: 2; }
    .arrow { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .grid { stroke: #30363d; }
      .axis { stroke: #656c76; }
      .goal { fill: #199e70; fill-opacity: 0.14; stroke: #199e70; }
      .goal-text { fill: #3fc796; }
      .s1 { fill: #3987e5; }
      .s2 { fill: #d95926; }
      .orig { fill: #f0f6fc; }
      .ring { stroke: #0d1117; }
      .arrow { stroke: #9198a1; }
      .arrowhead { fill: #9198a1; }
    }
  </style>

  <text class="ink" x="70" y="24" font-size="16" font-weight="600">Fry went down, but so did the voice match</text>
  <text class="muted" x="70" y="44" font-size="12.5">VoiceQualityVC presets on a 30 s test clip. Up and to the left is better.</text>

  <!-- goal zone: under 10% creak, voice match 0.75+ -->
  <rect class="goal" x="70" y="70" width="124" height="90" rx="4"/>
  <text class="goal-text" x="80" y="92" font-size="12" font-weight="600">Goal</text>
  <text class="goal-text" x="80" y="108" font-size="11.5">little fry,</text>
  <text class="goal-text" x="80" y="123" font-size="11.5">same voice</text>

  <!-- grid: y = 340 - (v - 0.4) * 600, x = 70 + pct * 12.4 -->
  <g class="grid">
    <line x1="70" x2="690" y1="280" y2="280"/>
    <line x1="70" x2="690" y1="220" y2="220"/>
    <line x1="70" x2="690" y1="160" y2="160"/>
    <line x1="70" x2="690" y1="100" y2="100"/>
    <line x1="194" x2="194" y1="70" y2="340"/>
    <line x1="318" x2="318" y1="70" y2="340"/>
    <line x1="442" x2="442" y1="70" y2="340"/>
    <line x1="566" x2="566" y1="70" y2="340"/>
    <line x1="690" x2="690" y1="70" y2="340"/>
  </g>
  <line class="axis" x1="70" x2="690" y1="340" y2="340"/>
  <line class="axis" x1="70" x2="70" y1="70" y2="340"/>

  <g class="muted" font-size="11.5" text-anchor="end">
    <text x="62" y="344">0.40</text>
    <text x="62" y="284">0.50</text>
    <text x="62" y="224">0.60</text>
    <text x="62" y="164">0.70</text>
    <text x="62" y="104">0.80</text>
  </g>
  <g class="muted" font-size="11.5" text-anchor="middle">
    <text x="70" y="358">0%</text>
    <text x="194" y="358">10%</text>
    <text x="318" y="358">20%</text>
    <text x="442" y="358">30%</text>
    <text x="566" y="358">40%</text>
    <text x="690" y="358">50%</text>
  </g>
  <text class="muted" x="380" y="382" font-size="12" text-anchor="middle">Creaky frames (share of voiced frames, CreaPy)</text>
  <text class="muted" font-size="12" text-anchor="middle" transform="translate(22 205) rotate(-90)">Voice match (ECAPA, vs clean reference)</text>

  <!-- arrow from original toward the cluster -->
  <path class="arrow" d="M 532 108 C 470 140, 400 175, 362 200"/>
  <path class="arrowhead" d="M 356 205 L 368 203 L 362 194 Z"/>

  <!-- original -->
  <circle class="orig ring" cx="543.7" cy="101.8" r="6.5"/>
  <text class="ink" x="556" y="99" font-size="12.5" font-weight="600">Original</text>
  <text class="muted" x="556" y="114" font-size="11.5">38% fry · 0.80</text>

  <!-- pitch -1 (circles) -->
  <g class="s1 ring">
    <circle cx="350.2" cy="212.8" r="5.5"/>
    <circle cx="280.8" cy="211.0" r="5.5"/>
    <circle cx="278.3" cy="218.2" r="5.5"/>
    <circle cx="605.7" cy="283.0" r="5.5"/>
  </g>
  <!-- pitch 0 (squares) -->
  <g class="s2 ring">
    <rect x="245.5" y="216.9" width="11" height="11" rx="2"/>
    <rect x="250.5" y="213.3" width="11" height="11" rx="2"/>
    <rect x="235.6" y="230.1" width="11" height="11" rx="2"/>
  </g>

  <text class="ink" x="296" y="262" font-size="12" text-anchor="middle">7 reduce-fry presets: 14–23% fry, voice match 0.57–0.62</text>
  <text class="muted" x="596" y="306" font-size="11.5" text-anchor="end">creak +3 (sanity check)</text>

  <!-- legend -->
  <g font-size="12">
    <circle class="s1" cx="76" cy="404" r="5.5"/>
    <text class="ink" x="88" y="408">Pitch −1 presets</text>
    <rect class="s2" x="200.5" y="398.5" width="11" height="11" rx="2"/>
    <text class="ink" x="218" y="408">Pitch 0 presets</text>
    <circle class="orig" cx="330" cy="404" r="6"/>
    <text class="ink" x="342" y="408">Original (16 kHz)</text>
  </g>
</svg>
